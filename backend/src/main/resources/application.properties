# ---- 数据源: SQLite ----
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${user.dir}/data/hygiene.db
quarkus.hibernate-orm.database.generation=update

# ---- HTTP ----
quarkus.http.port=8080

# ---- 业务参数 ----
# 临期阈值（天）：距到期日不足该天数即视为临期
app.near-expiry-days=7
# 是否在启动时写入演示数据
app.seed=true

# ---- 召回通知本地模拟接口 ----
quarkus.rest-client.recall-mock.url=http://localhost:8080

# ---- 测试环境 ----
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:${user.dir}/target/test-hygiene.db
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.app.seed=false
%test.quarkus.rest-client.recall-mock.url=http://localhost:8081
%test.quarkus.scheduler.enabled=false
