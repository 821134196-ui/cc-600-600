# ---- 数据源：SQLite ----
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:./data/tester-expiry.db
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# ---- HTTP ----
quarkus.http.port=8080
quarkus.http.cors=true

# ---- 业务参数 ----
# 临期阈值（天）：距效期不足该天数即视为临期
tester.near-expiry-days=30
# 本地模拟召回接口地址（由本应用 /mock-api 提供，模拟外部召回系统）
tester.recall.mock-base-url=http://localhost:8080/mock-api
# 模拟召回系统的数据文件
tester.recall.mock-file=data/recall-notices.json
# 演示数据开关
tester.seed.enabled=true

# 测试环境使用独立库文件，避免污染运行数据
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:target/test-default.db
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.tester.recall.mock-base-url=http://localhost:8081/mock-api
%test.tester.recall.mock-file=target/test-recall-notices.json
%test.tester.seed.enabled=false
